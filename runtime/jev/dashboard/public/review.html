<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医生 Agent · 产品质量工作台</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/review.css"><script src="/vendor/markdown-it.min.js"></script><script type="module" src="/review.js"></script></head><body><main>
<header class="masthead"><div><div class="brand"><img src="/logo.png" alt="" width="24" height="24">百川妇幼专科Agent · 产品质量工作台</div></div><div class="header-side"><span id="status" role="status">正在加载</span><button id="prompt">复核规则 ↗</button><button id="export">导出结果 ↓</button></div></header>
<nav class="stage-tabs" aria-label="评估流程"><a id="jev-link" href="/?dataset=physician">JEV 打标</a><a id="review-tab" href="?view=review">DeepSeek 复核</a><a id="board-tab" href="?view=board">产品问题与需求</a></nav>
<div class="review-toolbar"><select id="dataset" aria-label="数据批次"></select><span id="batch-note"></span><button id="run" class="primary">复核候选与抽查项</button></div>
<section id="metrics" class="review-metrics" aria-label="复核概览"></section><p id="notice" role="alert" hidden></p>
<section id="review-view"><div class="review-grid"><aside class="panel"><div class="panel-head"><h2>复核队列</h2><span id="queue-count"></span></div><div class="review-filters"><input id="search" type="search" placeholder="搜索问题或编号" aria-label="搜索QA"><select id="filter" aria-label="筛选复核结论"><option value="all">全部</option><option value="supported">有证据支持</option><option value="inconclusive">证据不足</option><option value="refuted">问题不成立</option><option value="pending">未复核 / 未抽查</option><option value="negative_spotcheck">漏检抽查</option></select></div><div id="queue" class="review-scroll"></div></aside><section class="panel"><div class="panel-head"><h2 id="qa-title">原始问答</h2><button id="session">完整会话 ↗</button></div><div id="qa" class="review-scroll prose"></div></section><section class="panel"><div class="panel-head"><h2>复核结论</h2><span class="model-label">DeepSeek V4.1 Flash</span></div><div id="result" class="review-scroll prose"></div></section></div></section>
<section id="board-view" hidden><div class="board-heading"><div><h1 id="board-title" tabindex="-1">问题簇</h1><p>按严重程度、证据状态、独立会话数排序。潜在严重风险优先送审。</p></div><select id="kind" aria-label="问题类型"><option value="all">全部类型</option><option value="answer_defect">回答缺陷</option><option value="capability_gap">能力缺口</option><option value="potential_need">潜在需求</option><option value="evaluation_issue">评估规则问题</option></select></div><div class="board-grid"><section class="panel"><div class="board-table-head"><span>优先级</span><span>问题与阅读依据</span><span>涉及会话</span><span>复核状态</span></div><div id="clusters"></div></section><aside class="panel cluster-detail prose" id="cluster-detail"><p>选择一个问题簇查看证据和改进方向。</p></aside></div></section>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="dialog-content" class="prose"></div></dialog>
</main></body></html>
